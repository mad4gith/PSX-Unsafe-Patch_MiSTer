name: Build PSX core (patched)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:        # bottone "Run workflow" manuale

permissions: write-all

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Check disk space
        run: df -h

      - name: Get latest upstream commit SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/MiSTer-devel/PSX_MiSTer.git HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore last built SHA
        id: cache
        uses: actions/cache@v4
        with:
          path: last-built-sha.txt
          key: last-built-sha

      - name: Compare and decide
        id: decide
        run: |
          LAST=$(cat last-built-sha.txt 2>/dev/null || echo "none")
          echo "Ultimo compilato: $LAST"
          echo "Upstream attuale: ${{ steps.upstream.outputs.sha }}"
          if [ "$LAST" == "${{ steps.upstream.outputs.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone fresh upstream core
        if: steps.decide.outputs.skip == 'false'
        run: git clone --depth 1 https://github.com/MiSTer-devel/PSX_MiSTer.git build

      - name: Apply patch
        if: steps.decide.outputs.skip == 'false'
        run: |
          cd build
          git apply --check ../patches/unsafe-warning-toggle.patch
          git apply ../patches/unsafe-warning-toggle.patch

      - name: Pull Quartus image
        if: steps.decide.outputs.skip == 'false'
        run: docker pull raetro/quartus:17.1

      - name: Compile
        id: compile
        if: steps.decide.outputs.skip == 'false'
        run: |
          docker run --rm -v ${{ github.workspace }}/build:/build -w /build \
            raetro/quartus:17.1 quartus_sh --flow compile PSX.qpf

      - name: Save new SHA
        if: steps.decide.outputs.skip == 'false'
        run: echo "${{ steps.upstream.outputs.sha }}" > last-built-sha.txt

      - name: Upload output
        if: steps.decide.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: PSX_rbf_${{ steps.upstream.outputs.sha }}
          path: build/output_files/*.rbf

      - name: Commit compiled rbf
        if: steps.decide.outputs.skip == 'false' && steps.compile.outcome == 'success'
        run: |
          mkdir -p _Console
          cp build/output_files/PSX.rbf _Console/PSX.rbf
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _Console/PSX.rbf
          git diff --staged --quiet || git commit -m "Update PSX core ($(date +%Y-%m-%d))"
          git push

      - name: Build Custom Database for MiSTer Downloader
        if: steps.decide.outputs.skip == 'false' && steps.compile.outcome == 'success'
        run: set -o pipefail && curl --fail --location https://raw.githubusercontent.com/theypsilon/Downloader_DB-Template_MiSTer/main/.github/build_db.py | python3 -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify result via GitHub issue
        if: always() && steps.decide.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = "${{ steps.compile.outcome }}"; // success, failure, cancelled
            const emoji = outcome === "success" ? "✅" : "❌";
            const sha = "${{ steps.upstream.outputs.sha }}".substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Build PSX core - upstream ${sha} - ${outcome}`,
              body: `**Esito compilazione:** ${outcome}\n**Commit upstream:** \`${sha}\`\n**Log completo:** ${runUrl}`
            });