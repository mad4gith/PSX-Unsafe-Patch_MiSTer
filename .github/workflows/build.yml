name: Build PSX core (patched)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:        # bottone "Run workflow" manuale

permissions: write-all

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Get latest official release filename
        id: latest_release
        run: |
          FILENAME=$(curl -s https://api.github.com/repos/MiSTer-devel/PSX_MiSTer/contents/releases | python3 -c "import sys, json; data = json.load(sys.stdin); files = sorted(f['name'] for f in data if f['name'].endswith('.rbf')); print(files[-1])")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "Ultimo rbf ufficiale: $FILENAME"

      - name: Compare with existing rbf in repo
        id: decide
        run: |
          LOCAL_FILE=$(ls _Console/PSX_*.rbf 2>/dev/null | head -n1)
          LOCAL_NAME=$(basename "${LOCAL_FILE:-none}")
          echo "File presente nel repo: $LOCAL_NAME"
          echo "Ultima release ufficiale: ${{ steps.latest_release.outputs.filename }}"
          if [ "$LOCAL_NAME" == "${{ steps.latest_release.outputs.filename }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.decide.outputs.skip == 'false'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Check disk space
        if: steps.decide.outputs.skip == 'false'
        run: df -h

      - name: Clone fresh upstream core
        if: steps.decide.outputs.skip == 'false'
        run: git clone --depth 1 https://github.com/MiSTer-devel/PSX_MiSTer.git build

      - name: Apply patch
        id: apply_patch
        if: steps.decide.outputs.skip == 'false'
        run: |
          cd build
          git apply --check ../patches/unsafe-warning-toggle.patch
          git apply ../patches/unsafe-warning-toggle.patch

      - name: Pull Quartus image
        if: steps.decide.outputs.skip == 'false' && steps.apply_patch.outcome == 'success'
        run: docker pull raetro/quartus:17.1

      - name: Compile
        id: compile
        if: steps.decide.outputs.skip == 'false' && steps.apply_patch.outcome == 'success'
        run: |
          docker run --rm -v ${{ github.workspace }}/build:/build -w /build \
            raetro/quartus:17.1 quartus_sh --flow compile PSX.qpf

      - name: Commit compiled rbf
        if: steps.decide.outputs.skip == 'false' && steps.compile.outcome == 'success'
        run: |
          mkdir -p _Console
          rm -f _Console/PSX*.rbf
          cp build/output_files/PSX.rbf "_Console/${{ steps.latest_release.outputs.filename }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _Console/
          git diff --staged --quiet || git commit -m "Update PSX core (${{ steps.latest_release.outputs.filename }})"
          git push

      - name: Build Custom Database for MiSTer Downloader
        if: steps.decide.outputs.skip == 'false' && steps.compile.outcome == 'success'
        run: set -o pipefail && curl --fail --location https://raw.githubusercontent.com/theypsilon/Downloader_DB-Template_MiSTer/main/.github/build_db.py | python3 -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify result via GitHub issue
        if: always() && steps.decide.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const patchOutcome = "${{ steps.apply_patch.outcome }}";
            const compileOutcome = "${{ steps.compile.outcome }}";
            const filename = "${{ steps.latest_release.outputs.filename }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let outcome, reason;
            if (patchOutcome !== "success") {
              outcome = "failure";
              reason = "La patch non si applica più correttamente (probabile modifica incompatibile a monte). Serve aggiornare patches/unsafe-warning-toggle.patch.";
            } else if (compileOutcome !== "success") {
              outcome = "failure";
              reason = "La patch si applica correttamente, ma la compilazione con Quartus è fallita.";
            } else {
              outcome = "success";
              reason = "Build completata con successo.";
            }

            const emoji = outcome === "success" ? "✅" : "❌";

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Build PSX core - ${filename} - ${outcome}`,
              body: `**Esito:** ${reason}\n**Release ufficiale:** \`${filename}\`\n**Log completo:** ${runUrl}`
            });